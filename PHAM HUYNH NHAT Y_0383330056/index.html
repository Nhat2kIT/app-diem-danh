<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login-BDU</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body>
  <div class="box">
    <div class="login-header">
      <h2><span class="icon"><i class="fa-solid fa-right-to-bracket"></i></span> LOGIN <span class="icon">❤️</span></h2>
    </div>

    <div class="login-content">
      <form class="login-form" id="loginForm">
        <input type="text" placeholder="Username" class="input-field" id="username" required />
        <input type="password" placeholder="Password" class="input-field" id="password" required />
        <button type="submit" class="login-button">Sign in</button>
        <div class="form-footer">
          <a href="forgot.html" class="forgot-password">Forgot Password</a>
        </div>
      </form>
    </div>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault(); // Ngăn không reload lại trang
  
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
  
      // Kiểm tra tài khoản (ví dụ: admin/123)
      if (username === "admin" && password === "123") {
        window.location.href = "Giangvien.html"; // Chuyển đến trang Giảng Viên
      } else {
        alert("Sai tên đăng nhập hoặc mật khẩu!");
      }
    });
  </script>
  
</body>
</html>
